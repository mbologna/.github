name: Publish to npm

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: false
        type: string
        default: lts/*
      package_manager:
        description: Package manager to use (npm or yarn)
        required: false
        type: string
        default: npm
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Sync package version to the release tag
        # When triggered by a published Release, the auto-release workflow pushes the
        # next tag (e.g. v1.2.3) without bumping package.json. Publishing the stale
        # package.json version would collide with an already-published version and fail
        # with HTTP 403. Deriving the version from the tag makes the tag the single
        # source of truth and keeps npm in lock-step with GitHub releases. Guarded so
        # non-release callers are unaffected; --allow-same-version keeps it idempotent.
        if: github.event.release.tag_name != ''
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Release tag: ${TAG} -> version ${VERSION}"
          if [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn version --new-version "${VERSION}" --no-git-tag-version
          else
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          fi

      - name: Lint
        run: ${{ inputs.package_manager }} run lint
        continue-on-error: true

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
