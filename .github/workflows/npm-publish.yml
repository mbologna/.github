name: Publish to npm

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: false
        type: string
        default: lts/*
      package_manager:
        description: Package manager to use (npm or yarn)
        required: false
        type: string
        default: npm

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: ${{ inputs.package_manager }}

      - name: Check npm supports Trusted Publishing (OIDC)
        # npm Trusted Publishing needs npm >= 11.5.1, which Node 24 LTS bundles
        # (11.19 as of 24.22). This used to run `npm install -g npm@latest`:
        # an unpinned npm, newer than any age gate, in the one job that can
        # publish. Now an older Node fails here instead of upgrading.
        if: inputs.package_manager == 'npm'
        run: |
          set -euo pipefail
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $v is older than 11.5.1 (Trusted Publishing); use a newer node_version"
            exit 1
          fi

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Sync package version to the release tag
        # When triggered by a published Release, the auto-release workflow pushes the
        # next tag (e.g. v1.2.3) without bumping package.json. Publishing the stale
        # package.json version would collide with an already-published version and fail
        # with HTTP 403. Deriving the version from the tag makes the tag the single
        # source of truth and keeps npm in lock-step with GitHub releases. Guarded so
        # non-release callers are unaffected; --allow-same-version keeps it idempotent.
        # auto-release dispatches this workflow on the tag instead (a Release
        # created with GITHUB_TOKEN triggers no `release` run), so a tag ref
        # counts too.
        if: github.event.release.tag_name != '' || github.ref_type == 'tag'
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Release tag: ${TAG} -> version ${VERSION}"
          if [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn version --new-version "${VERSION}" --no-git-tag-version
          else
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          fi

      - name: Lint
        run: ${{ inputs.package_manager }} run lint
        continue-on-error: true

      - name: Publish to npm (Trusted Publishing OIDC)
        # npm exchanges the GitHub OIDC token for a short-lived publish token and
        # generates provenance itself (no --provenance flag needed). The package
        # needs a trusted-publisher entry for the calling workflow on npmjs.com.
        # actions/setup-node always writes an `//registry/:_authToken=${NODE_AUTH_TOKEN}`
        # line into the userconfig .npmrc. With no token that line is an empty
        # token, which npm treats as "auth already configured" and SKIPS OIDC,
        # failing with ENEEDAUTH, so strip it first.
        run: |
          set -euo pipefail
          echo "npm version: $(npm --version)"
          echo "OIDC request env present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken=/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          npm publish --access public --loglevel verbose
