name: Publish to npm

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: false
        type: string
        default: lts/*
      package_manager:
        description: Package manager to use (npm or yarn)
        required: false
        type: string
        default: npm
    secrets:
      # Optional: only used as a fallback when npm Trusted Publishing (OIDC) is not
      # configured for the package on npmjs.com. With Trusted Publishing enabled the
      # npm CLI authenticates via short-lived OIDC tokens and no secret is needed.
      NPM_TOKEN:
        required: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: ${{ inputs.package_manager }}

      - name: Upgrade npm for Trusted Publishing (OIDC) support
        # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node LTS still ships
        # npm 10.x, so upgrade explicitly. The npm CLI auto-detects the OIDC
        # environment and uses it before falling back to NODE_AUTH_TOKEN, so this is
        # safe whether or not a trusted publisher is configured yet.
        if: inputs.package_manager == 'npm'
        run: npm install -g npm@latest

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Sync package version to the release tag
        # When triggered by a published Release, the auto-release workflow pushes the
        # next tag (e.g. v1.2.3) without bumping package.json. Publishing the stale
        # package.json version would collide with an already-published version and fail
        # with HTTP 403. Deriving the version from the tag makes the tag the single
        # source of truth and keeps npm in lock-step with GitHub releases. Guarded so
        # non-release callers are unaffected; --allow-same-version keeps it idempotent.
        if: github.event.release.tag_name != ''
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Release tag: ${TAG} -> version ${VERSION}"
          if [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn version --new-version "${VERSION}" --no-git-tag-version
          else
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          fi

      - name: Lint
        run: ${{ inputs.package_manager }} run lint
        continue-on-error: true

      - name: Publish to npm (Trusted Publishing OIDC, token fallback)
        # Two supported auth modes:
        #   1. Trusted Publishing (OIDC): no NPM_TOKEN secret. npm exchanges the
        #      GitHub OIDC token for a short-lived publish token and also generates
        #      provenance automatically (no --provenance flag needed).
        #   2. Token fallback: NPM_TOKEN provided -> classic token auth.
        # actions/setup-node always writes an `//registry/:_authToken=${NODE_AUTH_TOKEN}`
        # line into the userconfig .npmrc. When the secret is empty that line becomes an
        # empty token, which npm treats as "auth already configured" and SKIPS OIDC,
        # failing with ENEEDAUTH. So in OIDC mode we strip that line first.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "npm version: $(npm --version)"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN present -> publishing with token auth"
            NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --provenance --access public
          else
            echo "No NPM_TOKEN -> publishing via Trusted Publishing (OIDC)"
            echo "OIDC request env present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
              sed -i '/_authToken=/d' "${NPM_CONFIG_USERCONFIG}"
            fi
            npm publish --access public --loglevel verbose
          fi
