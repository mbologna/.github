name: Tag-based Release

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: false
        type: string
        default: lts/*
      test_command:
        description: Command to run tests (empty to skip)
        required: false
        type: string
        default: npm test
      build_command:
        description: Command to build release artifacts (empty to skip)
        required: false
        type: string
        default: npm run build
      asset_glob:
        description: Glob pattern for release assets to upload
        required: false
        type: string
        default: dist/*.zip

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: inputs.test_command != ''
        run: ${{ inputs.test_command }}

      - name: Build
        if: inputs.build_command != ''
        run: ${{ inputs.build_command }}

      - name: Extract version and changelog
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## \[/{if(p)exit; if($0 ~ "\["ver"\]"){p=1; next}}
              p && /^## \[/{exit}
              p{print}
            ' CHANGELOG.md > release_notes.md
          else
            echo "Release $VERSION" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: ${{ inputs.asset_glob }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
