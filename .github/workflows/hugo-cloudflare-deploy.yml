name: Hugo Cloudflare Deploy

on:
  workflow_call:
    inputs:
      hugo_version:
        description: Hugo version to use
        required: false
        type: string
        default: '0.168.0'
      dart_sass_version:
        description: Dart Sass release to install for css.Sass with the dartsass transpiler (leave empty to skip)
        required: false
        type: string
        default: ''
      cloudflare_project_name:
        description: Cloudflare Pages project name
        required: true
        type: string
      websub_feed_url:
        description: WebSub feed URL to ping after deploy (leave empty to skip)
        required: false
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ inputs.hugo_version }}
          extended: true

      - name: Setup Dart Sass
        if: inputs.dart_sass_version != ''
        env:
          DART_SASS_VERSION: ${{ inputs.dart_sass_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -fsSLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${asset}"
          # Dart Sass publishes no checksum file; GitHub records each asset's
          # digest, and an empty one fails the check
          digest=$(gh api "repos/sass/dart-sass/releases/tags/${DART_SASS_VERSION}" \
            --jq ".assets[] | select(.name == \"${asset}\") | .digest")
          echo "${digest#sha256:}  ${asset}" | sha256sum --check --strict
          tar -xzf "${asset}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name ${{ inputs.cloudflare_project_name }}

      - name: Ping WebSub hub
        if: inputs.websub_feed_url != ''
        env:
          WEBSUB_FEED_URL: ${{ inputs.websub_feed_url }}
        run: |
          curl -s -o /dev/null -X POST https://pubsubhubbub.appspot.com/ \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=$WEBSUB_FEED_URL"
