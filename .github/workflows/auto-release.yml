name: Auto Release

# Tags the next version and publishes its GitHub Release with notes grouped by
# Conventional Commit type, using the forge-agnostic auto-release image
# (https://github.com/mbologna/auto-release, which documents the rules). No
# release pull request: the caller runs this on its schedule.

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          'commits' (any commit since the last tag), 'conventional' (a feat, fix,
          perf, revert or breaking commit since the last tag) or 'docker'
          (compare image digests). A push always runs 'security' instead.
        required: true
        type: string
      image:
        description: >-
          Image without a tag (e.g. docker.io/mbologna/docker-bitlbee), for the docker
          strategy and the security strategy's CVE check
        required: false
        type: string
        default: ""
      base_image_pattern:
        description: Extended regex; matching Dockerfile lines go into every release's notes
        required: false
        type: string
        default: ""
      dispatch_tag_build:
        description: Start the calling workflow on the new tag (false when nothing builds on tags)
        required: false
        type: boolean
        default: true
      dispatch_workflow:
        description: >-
          Workflow file to start on the new tag (e.g. publish.yml); empty means the
          calling workflow
        required: false
        type: string
        default: ""
      dry_run:
        description: Only print the next version and its notes, in the job summary
        required: false
        type: boolean
        default: false

jobs:
  auto-release:
    name: Auto Release (${{ inputs.strategy }})
    runs-on: ubuntu-26.04
    # No permissions block: the job takes what the caller's job grants, which
    # must be `contents: write` (push the tag, create the Release) and
    # `actions: write` (dispatch the tag build). Declaring actions: write here
    # would make every caller that doesn't grant it fail at startup on its next
    # pin bump; inheriting it instead confines the failure to the dispatch.
    container:
      image: ghcr.io/mbologna/auto-release:0.2.0@sha256:28e5487aa0c4c6132961187504e1b17e9d62bcc41ffba009169877c1e1b45ec9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A tag pushed with GITHUB_TOKEN never triggers the caller's `push: tags`
      # run (GitHub's anti-recursion rule), so auto-release starts the build
      # with workflow_dispatch, the one event GITHUB_TOKEN may trigger. The
      # caller must list `workflow_dispatch` in its `on:`.
      - name: Release
        env:
          # A push releases only a CVE fix (a fix(security) commit, or an image
          # rebuild that dropped fixable HIGH/CRITICAL findings); everything
          # else waits for the scheduled run.
          AUTO_RELEASE_STRATEGY: ${{ github.event_name == 'push' && 'security' || inputs.strategy }}
          AUTO_RELEASE_IMAGE: ${{ inputs.image }}
          AUTO_RELEASE_BASE_IMAGE_PATTERN: ${{ inputs.base_image_pattern }}
          AUTO_RELEASE_DISPATCH: ${{ inputs.dispatch_tag_build }}
          AUTO_RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          # In a called workflow, github.workflow_ref is the caller's:
          # owner/repo/.github/workflows/ci.yml@refs/heads/main
          AUTO_RELEASE_DISPATCH_WORKFLOW: ${{ inputs.dispatch_workflow || github.workflow_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: auto-release release
