name: Auto Release

# Tags the next version and publishes its GitHub Release with notes grouped by
# Conventional Commit type, using the forge-agnostic auto-release image
# (https://github.com/mbologna/auto-release, which documents the rules). No
# release pull request: the caller runs this on its schedule.

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          Strategy for scheduled runs: 'conventional' (a feat, fix, perf,
          revert or breaking commit since the last tag) or 'commits' (any
          commit since the last tag). A push always runs 'security' instead
          and a manual run 'commits'. 'docker' is retired and runs as
          'conventional', with a deprecation warning.
        required: true
        type: string
      image:
        description: >-
          Image without a tag (e.g. ghcr.io/mbologna/bitlbee) that
          auto-release logs in to and, for a fresh rebuild, scans at the last
          version
        required: false
        type: string
        default: ""
      images:
        description: >-
          Several images built from this repository, for the fresh rebuild
          instead of image: IMAGE=DOCKERFILE entries separated by spaces or
          commas, each image without a tag and the Dockerfile it is built
          from (e.g. "docker.io/example/app-master=Dockerfile-master
          docker.io/example/app-minion=Dockerfile-minion"). One image with
          findings a rebuild fixes releases. Empty means image alone
        required: false
        type: string
        default: ""
      dockerfiles:
        description: >-
          Dockerfiles whose base images the security strategy compares,
          separated by spaces or commas (e.g. "Dockerfile-master
          Dockerfile-minion"); empty means auto-release's default, Dockerfile
        required: false
        type: string
        default: ""
      base_image_pattern:
        description: Extended regex; matching Dockerfile lines go into every release's notes
        required: false
        type: string
        default: ""
      dispatch_tag_build:
        description: Start the calling workflow on the new tag (false when nothing builds on tags)
        required: false
        type: boolean
        default: true
      dispatch_workflow:
        description: >-
          Workflow file to start on the new tag (e.g. publish.yml); empty means the
          calling workflow
        required: false
        type: string
        default: ""
      metadata_command:
        description: >-
          Shell command, run in the checkout, printing the pinned upstream
          version as SemVer build metadata: up2.15.3 makes the next tag
          v1.4.0+up2.15.3, and a change in it releases (VERSIONING.md)
        required: false
        type: string
        default: ""
      dry_run:
        description: >-
          Only print the next version and its notes, in the job summary. A
          manual run whose workflow_dispatch has a dry_run input that is true
          is a dry run too.
        required: false
        type: boolean
        default: false

jobs:
  auto-release:
    name: Auto Release (${{ inputs.strategy }})
    # Monday's schedule and a manual run release with the strategy below; a
    # push to the default branch releases only a CVE fix (the security
    # strategy). Pull requests, other branches and the tag build that
    # auto-release dispatches (it runs on the tag ref) skip the job, so a
    # caller needs no gate of its own. A schedule event carries no repository
    # payload, but always runs on the default branch.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-26.04
    # No permissions block: the job takes what the caller's job grants, which
    # must be `contents: write` (push the tag, create the Release) and
    # `actions: write` (dispatch the tag build). Declaring actions: write here
    # would make every caller that doesn't grant it fail at startup on its next
    # pin bump; inheriting it instead confines the failure to the dispatch.
    container:
      image: ghcr.io/mbologna/auto-release:2.0.0@sha256:1d9eec77b1b06cd84e06c371a989b989fcf7f4f6d5171ec6789dd8d5ab0aa07a
    steps:
      # Keeps the checkout's credentials: auto-release fetches tags from origin, which needs
      # them in a private repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # A tag pushed with GITHUB_TOKEN never triggers the caller's `push: tags`
      # run (GitHub's anti-recursion rule), so auto-release starts the build
      # with workflow_dispatch, the one event GITHUB_TOKEN may trigger. The
      # caller must list `workflow_dispatch` in its `on:`.
      - name: Release
        env:
          EVENT: ${{ github.event_name }}
          STRATEGY: ${{ inputs.strategy }}
          AUTO_RELEASE_IMAGE: ${{ inputs.image }}
          # Empty is the same as unset to auto-release.
          AUTO_RELEASE_IMAGES: ${{ inputs.images }}
          AUTO_RELEASE_BASE_IMAGE_PATTERN: ${{ inputs.base_image_pattern }}
          AUTO_RELEASE_DISPATCH: ${{ inputs.dispatch_tag_build }}
          AUTO_RELEASE_DRY_RUN: ${{ inputs.dry_run || github.event.inputs.dry_run == 'true' }}
          DOCKERFILES: ${{ inputs.dockerfiles }}
          # In a called workflow, github.workflow_ref is the caller's:
          # owner/repo/.github/workflows/ci.yml@refs/heads/main
          AUTO_RELEASE_DISPATCH_WORKFLOW: ${{ inputs.dispatch_workflow || github.workflow_ref }}
          # Empty means unset to auto-release: plain vX.Y.Z tags.
          AUTO_RELEASE_METADATA_CMD: ${{ inputs.metadata_command }}
          GITHUB_TOKEN: ${{ github.token }}
        # The strategy depends on what started the run:
        # - push: only a CVE fix (a fix(security) commit, a base image update
        #   that dropped fixable HIGH/CRITICAL findings, or a fresh rebuild
        #   due) releases, at once.
        # - workflow_dispatch: a manual run releases whatever is unreleased.
        # - schedule: the caller's strategy, normally 'conventional', so
        #   dependency-only changes never release on their own.
        # The 'docker' strategy (release on any image digest change) is
        # retired; a caller still passing it gets 'conventional' and a
        # warning until it is updated.
        #
        # AUTO_RELEASE_DOCKERFILES is exported only when the caller sets it, so
        # an empty input leaves auto-release's own default in charge.
        run: |
          if [ -n "$DOCKERFILES" ]; then export AUTO_RELEASE_DOCKERFILES="$DOCKERFILES"; fi
          scheduled=$STRATEGY
          if [ "$scheduled" = docker ]; then
            echo "::warning::strategy 'docker' is retired and runs as 'conventional'; pass strategy: conventional"
            scheduled=conventional
          fi
          case "$EVENT" in
            push) strategy=security ;;
            workflow_dispatch) strategy=commits ;;
            *) strategy=$scheduled ;;
          esac
          echo "strategy: $strategy (event $EVENT, caller's $STRATEGY)"
          AUTO_RELEASE_STRATEGY=$strategy auto-release release

  # What the next scheduled run would release, in the job summary: on a pull
  # request as if it merged now, on a push to the default branch as the
  # branch stands. It runs after the release job, so a push that released a
  # CVE fix previews from the new tag. It only plans: no tag, no Release, and
  # no image scan. auto-release measures the last tag's age at the time it
  # runs, so a maintenance release or fresh rebuild that only becomes due by
  # the scheduled run isn't shown; a fresh rebuild due now is the push's own
  # release job's to cut.
  preview:
    name: Release preview (${{ inputs.strategy }})
    needs: auto-release
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: ghcr.io/mbologna/auto-release:2.0.0@sha256:1d9eec77b1b06cd84e06c371a989b989fcf7f4f6d5171ec6789dd8d5ab0aa07a
    steps:
      # Keeps the checkout's credentials: auto-release fetches tags from origin, which needs
      # them in a private repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # A pull request checks out GitHub's test merge, whose "Merge <sha> into
      # <sha>" subject would land in the notes. Give it the subject the real
      # merge commit gets, which the notes skip. The job container runs as
      # root on the runner user's checkout, hence safe.directory.
      - name: Name the merge like the real one
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
        run: |
          git -c safe.directory="$PWD" -c user.name=auto-release -c user.email=auto-release@localhost \
            commit --amend --quiet --allow-empty -m "Merge pull request #$PR_NUMBER from $HEAD_LABEL"

      - name: Preview
        env:
          EVENT: ${{ github.event_name }}
          STRATEGY: ${{ inputs.strategy }}
          HAS_IMAGES: ${{ inputs.image != '' || inputs.images != '' }}
          AUTO_RELEASE_BASE_IMAGE_PATTERN: ${{ inputs.base_image_pattern }}
          AUTO_RELEASE_METADATA_CMD: ${{ inputs.metadata_command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scheduled=$STRATEGY
          if [ "$scheduled" = docker ]; then scheduled=conventional; fi
          {
            if [ "$EVENT" = pull_request ]; then
              printf 'What the next scheduled run (%s) releases if this pull request merges now.\n\n' "$scheduled"
            else
              printf 'What the next scheduled run (%s) releases as this branch stands.\n\n' "$scheduled"
            fi
            if [ "$scheduled" = conventional ]; then
              printf 'Not shown: a maintenance release (only dependency updates) that becomes due once the last tag is old enough by that run.\n\n'
            fi
            if [ "$HAS_IMAGES" = true ]; then
              printf 'Not shown: a fresh rebuild that becomes due by that run. Images are not scanned here; a push to the default branch releases one that is due now.\n\n'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          AUTO_RELEASE_STRATEGY=$scheduled auto-release plan
          grep -q '^## Next release' "$GITHUB_STEP_SUMMARY" ||
            printf 'No release due.\n' >>"$GITHUB_STEP_SUMMARY"
