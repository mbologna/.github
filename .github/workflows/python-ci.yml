name: Python CI

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version to use
        required: false
        type: string
        default: "3.12"
      use_uv:
        description: Use uv instead of pip
        required: false
        type: boolean
        default: false
      enable_codecov:
        description: Upload coverage to Codecov
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        if: inputs.use_uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up Python
        if: '!inputs.use_uv'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install ruff (pip)
        if: '!inputs.use_uv'
        run: pip install ruff

      - name: Lint
        run: |
          ${{ inputs.use_uv && 'uv run' || '' }} ruff check .
          ${{ inputs.use_uv && 'uv run' || '' }} ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        if: inputs.use_uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up Python
        if: '!inputs.use_uv'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install dependencies (pip)
        if: '!inputs.use_uv'
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi

      - name: Install dependencies (uv)
        if: inputs.use_uv
        run: uv sync

      - name: Run tests
        run: |
          ${{ inputs.use_uv && 'uv run' || '' }} pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: inputs.enable_codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.xml
