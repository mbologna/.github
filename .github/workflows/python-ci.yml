name: Python CI

# uv only: every caller has a pyproject.toml and a uv.lock. The steps match
# the GitLab python-test component: uv sync --locked, ruff check, ruff
# format --check, pytest, then pip-audit on the runtime dependencies.

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version to use
        required: false
        type: string
        default: "3.15"
      enable_codecov:
        description: Upload coverage to Codecov
        required: false
        type: boolean
        default: true
      coverage_fail_under:
        description: >-
          Minimum total coverage, in percent, below which the Test job fails
          (pytest --cov-fail-under). Empty (the default) uses fail_under from
          the project's coverage config ([tool.coverage.report] in
          pyproject.toml), and no gate when that isn't set either.
        required: false
        type: string
        default: ""
      pip_audit_version:
        description: >-
          pip-audit version for the dependency audit. Renovate tracks this
          default (PyPI pip-audit), so a caller should not set it.
        required: false
        type: string
        default: "2.10.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned, so the tool that enforces the callers' exclude-newer cooldown
          # is age-gated too (Renovate tracks this input against astral-sh/uv
          # releases); unpinned, setup-uv took the newest uv, a day old.
          version: "0.13.7"
          python-version: ${{ inputs.python_version }}

      # Fail on a uv.lock that no longer matches pyproject.toml instead of
      # quietly re-locking.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-26.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned, so the tool that enforces the callers' exclude-newer cooldown
          # is age-gated too (Renovate tracks this input against astral-sh/uv
          # releases); unpinned, setup-uv took the newest uv, a day old.
          version: "0.13.7"
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: uv sync --locked

      # Known vulnerabilities in what the image ships: the locked runtime
      # dependencies, without the dev group. --no-deps and --disable-pip
      # audit exactly the pinned list instead of resolving it again. Fails
      # the job on a finding: Renovate's CVE pull requests fix them.
      # --no-hashes: once one line has a hash pip-audit wants all of them
      # hashed, and uv writes none for the project itself or a git
      # dependency (pip-audit lists those as skipped). The audit matches on
      # name and version, so the hashes add nothing to it.
      - name: Audit dependencies
        env:
          PIP_AUDIT_VERSION: ${{ inputs.pip_audit_version }}
        run: |
          set -o pipefail
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt |
            uvx "pip-audit==${PIP_AUDIT_VERSION}" -r /dev/stdin --no-deps --disable-pip

      # The coverage gate: pytest-cov fails the run below --cov-fail-under,
      # and without the flag it reads fail_under from the coverage config
      # itself, so an empty input still gates a project that sets one.
      - name: Run tests
        env:
          FAIL_UNDER: ${{ inputs.coverage_fail_under }}
        run: |
          set -euo pipefail
          gate=()
          if [ -n "$FAIL_UNDER" ]; then
            if ! [[ $FAIL_UNDER =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::coverage_fail_under must be a number of percent, not '${FAIL_UNDER}'"
              exit 1
            fi
            gate=(--cov-fail-under="$FAIL_UNDER")
            echo "Coverage gate: ${FAIL_UNDER}% (coverage_fail_under input)"
          else
            echo "Coverage gate: fail_under from the coverage config, if the project sets one"
          fi
          uv run --locked pytest --cov --cov-report=xml --cov-report=term-missing "${gate[@]}"

      - name: Upload coverage to Codecov
        if: inputs.enable_codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
