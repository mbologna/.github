name: Python CI

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version to use
        required: false
        type: string
        default: "3.12"
      use_uv:
        description: Use uv instead of pip
        required: false
        type: boolean
        default: false
      enable_codecov:
        description: Upload coverage to Codecov
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        if: inputs.use_uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned, so the tool that enforces the callers' exclude-newer cooldown
          # is age-gated too (Renovate tracks this input against astral-sh/uv
          # releases); unpinned, setup-uv took the newest uv, a day old.
          version: "0.12.24"
          python-version: ${{ inputs.python_version }}

      # With a uv.lock, fail on a lock that no longer matches pyproject.toml
      # instead of quietly re-locking (uv sync / uv run read UV_LOCKED).
      - name: Require an up-to-date uv.lock
        if: inputs.use_uv
        run: if [ -f uv.lock ]; then echo "UV_LOCKED=1" >> "$GITHUB_ENV"; fi

      - name: Set up Python
        if: '!inputs.use_uv'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install ruff (pip)
        if: '!inputs.use_uv'
        run: pip install ruff

      - name: Lint
        run: |
          ${{ inputs.use_uv && 'uv run' || '' }} ruff check .
          ${{ inputs.use_uv && 'uv run' || '' }} ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        if: inputs.use_uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned, so the tool that enforces the callers' exclude-newer cooldown
          # is age-gated too (Renovate tracks this input against astral-sh/uv
          # releases); unpinned, setup-uv took the newest uv, a day old.
          version: "0.12.24"
          python-version: ${{ inputs.python_version }}

      # With a uv.lock, fail on a lock that no longer matches pyproject.toml
      # instead of quietly re-locking (uv sync / uv run read UV_LOCKED).
      - name: Require an up-to-date uv.lock
        if: inputs.use_uv
        run: if [ -f uv.lock ]; then echo "UV_LOCKED=1" >> "$GITHUB_ENV"; fi

      - name: Set up Python
        if: '!inputs.use_uv'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install dependencies (pip)
        if: '!inputs.use_uv'
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi

      - name: Install dependencies (uv)
        if: inputs.use_uv
        run: uv sync

      - name: Run tests
        run: |
          ${{ inputs.use_uv && 'uv run' || '' }} pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: inputs.enable_codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
