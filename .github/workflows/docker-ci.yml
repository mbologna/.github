name: Docker CI

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name (without registry prefix)
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to the repository root
        required: false
        type: string
        default: Dockerfile
      version_command:
        description: >-
          Optional shell command run inside the built image (linux/amd64) that prints
          the software version, e.g. "salt-master --version | cut -d' ' -f2". The
          version and its major part become extra tags on the default branch, for an
          image whose version comes from what it installs rather than from a git tag.
        required: false
        type: string
        default: ""
      push_to_dockerhub:
        description: Also push to Docker Hub (requires DOCKER_USERNAME / DOCKER_PASSWORD secrets)
        required: false
        type: boolean
        default: true
      platforms:
        description: Comma-separated list of target platforms (informational; native runners are used per-platform)
        required: false
        type: string
        default: linux/amd64,linux/arm64
      enable_grype:
        description: Run Grype vulnerability scanner in addition to Trivy
        required: false
        type: boolean
        default: false
      enable_cosign:
        description: Sign images with Cosign (keyless / OIDC)
        required: false
        type: boolean
        default: true
      enable_integration_test:
        description: Run scripts/integration-test.sh after build
        required: false
        type: boolean
        default: false
      enable_release_drafter:
        description: Create a GitHub release on tag push
        required: false
        type: boolean
        default: false
      extra_tags:
        description: >-
          Extra docker/metadata-action tag rules, one per line, appended to the
          defaults (e.g. type=raw,value=4.5.2,enable={{is_default_branch}} for an
          image whose version comes from its base image rather than a git tag)
        required: false
        type: string
        default: ""
      yamllint_paths:
        description: Space-separated paths for yamllint to scan
        required: false
        type: string
        default: .github/workflows/
    outputs:
      digest:
        description: Built multi-arch image digest
        value: ${{ jobs.merge.outputs.digest }}
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          failure-threshold: error
          # DL3006 (no tag) / DL3007 (:latest) stay warning-level by default, which
          # this failure-threshold ignores. Force them to error so unpinned/:latest
          # base images actually fail CI; everything else keeps today's severity so
          # unrelated pre-existing warnings don't start failing as a side effect.
          override-error: DL3006,DL3007

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: ${{ inputs.yamllint_paths }}
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              truthy:
                allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
              empty-lines:
                max: 2
                max-start: 0
                max-end: 1
              document-start: disable
              new-line-at-end-of-file: disable

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Scoped per image: a repository may call this workflow once per image.
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ inputs.image_name }}-${{ matrix.cache_scope }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ inputs.image_name }}-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-26.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-${{ inputs.image_name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: inputs.push_to_dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version from the image
        id: version
        if: inputs.version_command != ''
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          VERSION_COMMAND: ${{ inputs.version_command }}
        # The digests are per platform; only the amd64 one runs on this runner.
        run: |
          set -euo pipefail
          version=""
          for digest in *; do
            if version=$(docker run --rm --platform linux/amd64 --entrypoint sh \
                "${IMAGE}@sha256:${digest}" -c "${VERSION_COMMAND}" 2>/dev/null) && [ -n "$version" ]; then
              break
            fi
          done
          if ! [[ $version =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version_command printed '${version}', not a version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKERHUB_IMAGE: ${{ format('{0}/{1}', secrets.DOCKER_USERNAME, inputs.image_name) }}
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
            ${{ inputs.push_to_dockerhub && env.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ steps.version.outputs.version && format('type=raw,value={0},enable={{{{is_default_branch}}}}', steps.version.outputs.version) || '' }}
            ${{ steps.version.outputs.major && format('type=raw,value={0},enable={{{{is_default_branch}}}}', steps.version.outputs.major) || '' }}
            ${{ inputs.extra_tags }}

      - name: Create multi-arch manifest and push tags
        id: merge
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@sha256:%s ' *)
          SHORT_SHA="${GITHUB_SHA::7}"
          DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:sha-${SHORT_SHA}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ steps.merge.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ inputs.image_name }}.cyclonedx.json

  scan-trivy:
    name: Security Scan (trivy)
    runs-on: ubuntu-26.04
    needs: merge
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          timeout: 10m

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  scan-grype:
    name: Security Scan (grype)
    runs-on: ubuntu-26.04
    needs: merge
    if: inputs.enable_grype && github.event_name != 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype
        continue-on-error: true
        run: |
          grype db update
          grype "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}" \
            --output sarif > grype-results.sarif

      - name: Upload Grype SARIF
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: grype-results.sarif
          category: grype

  sign:
    name: Sign Images
    runs-on: ubuntu-26.04
    needs: merge
    if: inputs.enable_cosign && github.event_name != 'pull_request'
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push_to_dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign GHCR image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}"

      - name: Sign Docker Hub image
        if: inputs.push_to_dockerhub
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            "${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-26.04
    needs: merge
    if: inputs.enable_integration_test && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: bash scripts/integration-test.sh

  cleanup:
    name: Cleanup old package versions
    runs-on: ubuntu-26.04
    needs: [scan-trivy, scan-grype, sign, integration-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.scan-trivy.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Delete untagged and old versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Regular expressions for package and exclude-tags (use-regex below).
          # exclude-tags is ONE regex (not a comma list) and must pass the
          # action's safe-regex2 check: no nested quantifiers.
          package: ^${{ inputs.image_name }}$
          keep-n-tagged: 5
          delete-untagged: true
          # Concurrent runs push untagged per-arch digests that their merge job
          # only tags minutes later; without an age floor this cleanup deleted
          # them mid-run ("<image>@sha256:...: not found" on Renovate branches of
          # thelounge-digest and toggl-insights, 2026-10). Applies to every rule.
          older-than: 1 day
          delete-ghost-images: true
          delete-partial-images: true
          # Release tags (1.0.0, v2.3, 3006, 4.5.2-rc1) are what consumers pin as
          # tag@digest, so never delete them. With only latest,main excluded,
          # keep-n-tagged counted every sha-*/branch tag, and a busy day of main
          # pushes deleted backup-monitor's 1.0.0 image while hotel still pinned
          # it (2026-10-22).
          exclude-tags: '^(latest|main|master)$|^v?[0-9][0-9.]*$|^v?[0-9][0-9.]*-[0-9A-Za-z.]+$'
          use-regex: true

  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: [merge, scan-trivy, scan-grype, sign]
    # !cancelled() && !failure(): without a status function, a skipped need
    # skips this job too, and scan-grype (and sign, without enable_cosign) is
    # skipped unless the caller opts in, so no release was ever created. A
    # failed need still blocks it.
    # workflow_dispatch too: auto-release starts the tag build that way (a tag
    # pushed with GITHUB_TOKEN triggers no push run).
    if: |
      !cancelled() && !failure() &&
      needs.merge.result == 'success' &&
      inputs.enable_release_drafter &&
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Draft release notes
        id: notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

