name: Docker CI

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name (without registry prefix)
        required: true
        type: string
      legacy_image_names:
        description: >-
          Optional comma-separated former names of the image (e.g. docker-bitlbee).
          Every build also pushes, signs and cleans them, with the same tags and
          digest, so users of a renamed image keep getting updates: neither GHCR
          nor Docker Hub redirects a renamed repository. Keep it for as long as
          the old names should get updates.
        required: false
        type: string
        default: ""
      dockerfile:
        description: Dockerfile path, relative to the repository root
        required: false
        type: string
        default: Dockerfile
      allowed_tools:
        description: >-
          Tools the image policy check lets the final image keep on its binary
          paths (pip, uv, npm, composer, compilers, make, git and the like),
          separated by spaces or commas, for an image whose application runs
          them. Say why in the Dockerfile or README.
        required: false
        type: string
        default: ""
      allow_root:
        description: >-
          Why the image runs as root, when it must (an s6-overlay PID 1 that
          drops privileges per service, a CI job image). Non-empty lets the
          image policy check pass an image whose config User is empty, root or
          0, and prints the reason; empty fails such an image.
        required: false
        type: string
        default: ""
      version_command:
        description: >-
          Optional shell command run inside the built image (linux/amd64) that prints
          the software version, e.g. "salt-master --version | cut -d' ' -f2". The
          version and its major part become extra tags on the default branch (on
          release tags with publish: release), for an image whose version comes
          from what it installs rather than from a git tag.
        required: false
        type: string
        default: ""
      push_to_dockerhub:
        description: Also push to Docker Hub (requires DOCKER_USERNAME / DOCKER_PASSWORD secrets)
        required: false
        type: boolean
        default: true
      enable_cosign:
        description: Sign images with Cosign (keyless / OIDC)
        required: false
        type: boolean
        default: true
      enable_integration_test:
        description: Run scripts/integration-test.sh after build
        required: false
        type: boolean
        default: false
      extra_tags:
        description: >-
          Extra docker/metadata-action tag rules, one per line, appended to the
          defaults (e.g. type=raw,value=4.5.2,enable={{is_default_branch}} for an
          image whose version comes from its base image rather than a git tag).
          With publish: release only tag builds push, where {{is_default_branch}}
          is false: use enable=true there.
        required: false
        type: string
        default: ""
      publish:
        description: >-
          When to push the image. 'push': on the default branch, on schedule and
          on tags; other branches and pull requests build without pushing.
          'release': only on v* tags (pushed, or dispatched on the tag ref, as
          auto-release does); pull requests build without pushing and branch
          pushes only lint, and latest moves to the newest release.
        required: false
        type: string
        default: push
      skip_paths:
        description: >-
          Patterns, one per line, of files that cannot change the image (bash
          [[ == ]] patterns: * also matches /). A pull request or branch push
          whose changed files all match builds nothing, so a docs- or CI-only
          change neither checks nor publishes (nor deploys, in a push-mode
          caller) an image. Tags, schedules and manual runs always build, and so
          does anything the compare API can't answer (a new branch, a
          force-push, over 300 files).
        required: false
        type: string
        default: |
          .github/*
          docs/*
          tests/*
          *.md
          renovate.json
          .pre-commit-config.yaml
          .gitignore
          LICENSE
      release_strategy:
        description: >-
          Runs auto-release.yml after the build when set: its strategy for
          Monday's schedule, normally 'conventional'. Empty (the default) runs
          no release. A push to the default branch releases only a CVE fix and
          a manual run releases whatever is unreleased; pull requests, other
          branches and tag builds skip it (the gate is in auto-release.yml).
          The calling job must grant contents: write (the tag and the Release)
          and actions: write (to dispatch the tag build), and the caller must
          list workflow_dispatch in its on:.
        required: false
        type: string
        default: ""
      release_image:
        description: >-
          Image without a tag that auto-release logs in to; empty means
          ghcr.io/<owner>/<image_name>
        required: false
        type: string
        default: ""
      dockerfiles:
        description: >-
          Dockerfiles whose base images auto-release's security strategy
          compares, separated by spaces or commas; empty means the dockerfile
          input
        required: false
        type: string
        default: ""
      dispatch_workflow:
        description: >-
          Workflow file auto-release starts on the new tag; empty means the
          calling workflow
        required: false
        type: string
        default: ""
      deploy_type:
        description: >-
          Deploys the image to Cloud Run with gcp-deploy.yml when set: 'service'
          or 'job'. Only a push or a manual run on the default branch that
          pushed an image deploys; a build that skip_paths skipped, a pull
          request or a tag build doesn't. Needs publish: push (the deploy runs
          the sha-* image), the GCP_WORKLOAD_IDENTITY_PROVIDER and
          GCP_SERVICE_ACCOUNT secrets (secrets: inherit) and id-token: write.
        required: false
        type: string
        default: ""
      deploy_name:
        description: Cloud Run service or job name; empty means image_name
        required: false
        type: string
        default: ""
      region:
        description: Cloud Run region
        required: false
        type: string
        default: us-central1
      yamllint_paths:
        description: Space-separated paths for yamllint to scan
        required: false
        type: string
        default: .github/workflows/
    outputs:
      digest:
        description: Built multi-arch image digest
        value: ${{ jobs.merge.outputs.digest }}
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      # Every later job keys off the build and push outputs, so nothing that
      # expects a pushed digest (merge, scans, signing, tests, cleanup,
      # deploy) runs when nothing was pushed. A schedule event carries no
      # repository payload, but always runs on the default branch.
      - name: Decide what to build and push
        id: plan
        env:
          PUBLISH: ${{ inputs.publish }}
          EVENT: ${{ github.event_name }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          SKIP_PATHS: ${{ inputs.skip_paths }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PUBLISH" != push ] && [ "$PUBLISH" != release ]; then
            echo "::error::publish must be 'push' or 'release', not '${PUBLISH}'"
            exit 1
          fi
          build=true
          push=false
          if [ "$EVENT" = pull_request ]; then
            : # build to check the Dockerfile, never push
          elif [ "$PUBLISH" = release ]; then
            if [[ $GITHUB_REF == refs/tags/v* ]]; then push=true; else build=false; fi
          elif [[ $GITHUB_REF == refs/tags/* || $GITHUB_REF == "$DEFAULT_REF" || $EVENT == schedule ]]; then
            push=true
          fi
          # The changed files of a pull request or branch push. Tags,
          # schedules and manual runs have none, and anything the compare API
          # can't answer (a new branch, a force-push, over 300 files) counts as
          # unknown: both checks below then do their work.
          files=""
          known=false
          if { [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [[ $GITHUB_REF == refs/heads/* ]]; }; } \
            && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            if files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" \
                --jq 'if (.files | length) >= 300 then error("too many files") else .files[].filename end' 2>/dev/null) \
                && [ -n "$files" ]; then
              known=true
            else
              echo "could not list the changed files: building and linting"
            fi
          fi
          # Only image inputs justify a build: skip it when every changed file
          # matches skip_paths.
          if [ "$build" = true ] && [ "$known" = true ] && [ -n "$SKIP_PATHS" ]; then
            image_change=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              matched=false
              while IFS= read -r pat; do
                [ -n "$pat" ] || continue
                # shellcheck disable=SC2053 # $pat is a pattern on purpose
                if [[ $f == $pat ]]; then matched=true; break; fi
              done <<< "$SKIP_PATHS"
              if [ "$matched" = false ]; then image_change=true; echo "image input changed: ${f}"; break; fi
            done <<< "$files"
            if [ "$image_change" = false ]; then
              echo "only files in skip_paths changed: no build"
              build=false
              push=false
            fi
          fi
          # hadolint only when the Dockerfile (or its config) changed.
          hadolint=true
          if [ "$known" = true ]; then
            hadolint=false
            while IFS= read -r f; do
              case "$f" in
                "${DOCKERFILE#./}" | .hadolint.yaml | .hadolint.yml) hadolint=true ;;
              esac
            done <<< "$files"
          fi
          echo "publish=${PUBLISH} event=${EVENT} ref=${GITHUB_REF}: build=${build} push=${push} hadolint=${hadolint}"
          {
            echo "build=${build}"
            echo "push=${push}"
            echo "hadolint=${hadolint}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hadolint
        if: steps.plan.outputs.hadolint == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          failure-threshold: error
          # DL3006 (no tag) / DL3007 (:latest) stay warning-level by default, which
          # this failure-threshold ignores. Force them to error so unpinned/:latest
          # base images actually fail CI; everything else keeps today's severity so
          # unrelated pre-existing warnings don't start failing as a side effect.
          override-error: DL3006,DL3007

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: ${{ inputs.yamllint_paths }}
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              truthy:
                allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
              empty-lines:
                max: 2
                max-start: 0
                max-end: 1
              document-start: disable
              new-line-at-end-of-file: disable

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    # No job-level if: a skipped matrix job reports as "Build (${{ matrix.platform }})"
    # and never as the per-platform checks rulesets require, which blocked every PR
    # that skip_paths skipped. The job always runs and skips its steps instead.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64
    steps:
      - name: Nothing to build
        if: needs.lint.outputs.build != 'true'
        run: echo "No image to build for this change (see the Lint job's plan step)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.lint.outputs.build == 'true'

      - name: Set up Docker Buildx
        if: needs.lint.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: needs.lint.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Where the image came from, which commit, and on a release tag which
      # version: the standard's OCI labels (README, "Container images"),
      # set here so no Dockerfile has to repeat them.
      - name: Image labels
        id: labels
        if: needs.lint.outputs.build == 'true'
        run: |
          {
            echo 'labels<<EOF'
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "org.opencontainers.image.version=${GITHUB_REF_NAME#v}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push (by digest)
        id: build
        if: needs.lint.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.labels.outputs.labels }}
          # The second output is the same image as an OCI layout directory,
          # for the image policy check below.
          outputs: |
            type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=${{ needs.lint.outputs.push }}
            type=oci,dest=${{ runner.temp }}/image-oci,tar=false
          # Scoped per image: a repository may call this workflow once per image.
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ inputs.image_name }}-${{ matrix.cache_scope }},mode=max
          # A release builds from scratch: with the cache, apk/apt layers came back
          # unchanged and a security release shipped the same packages (auto-release
          # 0.3.1 had 0.3.0's digest, 12 fixable HIGH findings and all). Pull
          # requests and branch builds keep the cache.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/v') }}
          pull: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: false
          sbom: false

      # The standard's runtime rules (README, "Container images"), checked on
      # the image this job just built, before anything tags it: a pull
      # request fails here, and a release build that fails never reaches the
      # merge job, so no tag points at it. Reads the layers and the config
      # from the OCI layout; nothing in the image runs.
      - name: Image policy
        if: needs.lint.outputs.build == 'true'
        shell: sh {0}
        env:
          IMAGE_POLICY_LAYOUT: ${{ runner.temp }}/image-oci
          IMAGE_POLICY_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
          IMAGE_POLICY_ALLOW_ROOT: ${{ inputs.allow_root }}
          IMAGE_POLICY_DOCS: https://github.com/mbologna/.github#image-policy-check
        run: |
          # Image policy: checks the built image, without running it, against the
          # container image standard: no package manager, compiler or git on the
          # binary paths, and a non-root user. POSIX sh with tar, gzip, awk, sed, od
          # and sort, so the same code runs on a GitHub runner and in kaniko's
          # busybox, and in mbologna/.github's docker-ci and ci-templates' kaniko-build.
          #   IMAGE_POLICY_LAYOUT         the image, as an OCI image layout directory
          #   IMAGE_POLICY_ALLOWED_TOOLS  tools the image may keep (space or comma list)
          #   IMAGE_POLICY_ALLOW_ROOT     non-empty: the reason the image runs as root
          #   IMAGE_POLICY_DOCS           where the standard is written down
          set -eu
          layout=$IMAGE_POLICY_LAYOUT
          allowed=$(printf '%s' "${IMAGE_POLICY_ALLOWED_TOOLS:-}" | tr ',' ' ')
          allow_root=${IMAGE_POLICY_ALLOW_ROOT:-}

          # Flattens JSON into one "path=value" line per scalar (0.Layers.2=...,
          # config.User=...).
          json_flat() {
            awk '
              { s = s $0 "\n" }
              END {
                n = length(s); d = 0
                for (i = 1; i <= n; i++) {
                  c = substr(s, i, 1)
                  if (c == "\"") {
                    v = ""
                    for (i++; i <= n; i++) {
                      c = substr(s, i, 1)
                      if (c == "\\") { i++; v = v substr(s, i, 1); continue }
                      if (c == "\"") break
                      v = v c
                    }
                    j = i + 1
                    while (substr(s, j, 1) ~ /[ \t\r\n]/) j++
                    if (d > 0 && t[d] == "o" && substr(s, j, 1) == ":") { k[d] = v; i = j }
                    else emit(v)
                  } else if (c == "{") { d++; t[d] = "o"; k[d] = "" }
                  else if (c == "[") { d++; t[d] = "a"; x[d] = 0 }
                  else if (c == "}" || c == "]") d--
                  else if (c == ",") { if (t[d] == "a") x[d]++ }
                  else if (c !~ /[ \t\r\n:]/) {
                    v = c
                    while (substr(s, i + 1, 1) !~ /[],} \t\r\n]/ && i < n) { i++; v = v substr(s, i, 1) }
                    emit(v)
                  }
                }
              }
              function emit(v,   p, m) {
                p = ""
                for (m = 1; m <= d; m++) p = p (m > 1 ? "." : "") (t[m] == "o" ? k[m] : x[m])
                print p "=" v
              }'
          }

          blob() { printf '%s/blobs/%s' "$layout" "$(printf '%s' "$1" | tr ':' '/')"; }

          # index.json names the image manifest, possibly through an index.
          manifest=$(json_flat < "$layout/index.json")
          depth=0
          while :; do
            digest=$(printf '%s\n' "$manifest" | sed -n 's/^manifests\.0\.digest=//p')
            [ -n "$digest" ] || break
            depth=$((depth + 1))
            if [ "$depth" -gt 3 ]; then echo "image-policy: no image manifest in $layout" >&2; exit 1; fi
            manifest=$(json_flat < "$(blob "$digest")")
          done
          config=$(printf '%s\n' "$manifest" | sed -n 's/^config\.digest=//p')
          layers=$(printf '%s\n' "$manifest" | sed -n 's/^layers\.[0-9]*\.digest=//p')
          if [ -z "$config" ]; then echo "image-policy: no image config in $layout" >&2; exit 1; fi
          user=$(json_flat < "$(blob "$config")" | sed -n 's/^config\.User=//p')

          # Every layer's file list, in order, an empty line before each layer.
          list_layers() {
            for layer in $layers; do
              echo
              file=$(blob "$layer")
              magic=$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')
              case "$magic" in
                1f8b*) gzip -dc "$file" | tar -tf - ;;
                28b52ffd)
                  echo "image-policy: layer $layer is zstd-compressed, which this check can't read" >&2
                  return 1
                  ;;
                *) tar -tf "$file" ;;
              esac
            done
          }

          # The tools left in the final filesystem: a whiteout (.wh.<name>) or an
          # opaque directory (.wh..wh..opq) in a later layer removes what lower layers
          # put there.
          found=$(list_layers | awk -v allowed="$allowed" '
            function flush(p) { for (p in add) have[p] = 1; split("", add) }
            function drop(prefix, exact,   p) {
              for (p in have) if (p == exact || index(p, prefix) == 1) delete have[p]
            }
            BEGIN { split(allowed, a, " "); for (i in a) ok[a[i]] = 1 }
            $0 == "" { flush(); next }
            {
              p = $0
              sub(/^\.\//, "", p); sub(/^\//, "", p); sub(/\/$/, "", p)
              base = p; dir = ""
              if (match(p, /.*\//)) { dir = substr(p, 1, RLENGTH - 1); base = substr(p, RLENGTH + 1) }
              if (base == ".wh..wh..opq") { drop(dir "/", "\001"); next }
              if (substr(base, 1, 4) == ".wh.") {
                target = (dir == "" ? "" : dir "/") substr(base, 5)
                drop(target "/", target); next
              }
              if (dir !~ /^(bin|sbin|usr\/bin|usr\/sbin|usr\/local\/bin|usr\/local\/sbin|opt\/venv\/bin)$/ && dir !~ /(^|\/)\.?venv\/bin$/) next
              if (base ~ /^(pip|pip3|pip3\..+|uv|uvx|npm|npx|corepack|yarn|pnpm|composer|gcc|cc|g[+][+]|c[+][+]|clang|make|git)$/) add[p] = 1
            }
            END {
              flush()
              for (p in have) {
                base = p; sub(/.*\//, "", base)
                print (base in ok ? "allowed" : "found") " /" p " " base
              }
            }' | sort)

          status=0
          echo "Image policy (${IMAGE_POLICY_DOCS:-the container image standard}):"
          if [ -n "$found" ]; then
            printf '%s\n' "$found" | while read -r kind path tool; do
              if [ "$kind" = allowed ]; then
                echo "  allowed  $path ($tool is in allowed_tools)"
              else
                echo "  FAIL     $path: $tool doesn't belong in a runtime image"
              fi
            done
          fi
          bad=$(printf '%s\n' "$found" | awk '$1 == "found" { print $3 }' | sort -u | tr '\n' ' ')
          if [ -n "$bad" ]; then
            status=1
            echo "  Remove these from the final stage (build them in an earlier stage), or,"
            echo "  when the application runs them, declare them with the allowed_tools input:"
            echo "    allowed_tools: \"${allowed:+$allowed }${bad% }\""
            echo "  and say why in the Dockerfile or README."
          elif [ -z "$found" ]; then
            echo "  ok       no package manager, compiler or git on the binary paths"
          fi

          uid=${user%%:*}
          shown=${user:-unset}
          case "$uid" in
            "" | root | 0)
              if [ -n "$allow_root" ]; then
                echo "  allowed  user '${shown}' runs as root: ${allow_root}"
              else
                status=1
                echo "  FAIL     user '${shown}' (the image config's User) runs as root."
                echo "  Add USER with a fixed numeric UID to the final stage, or, when the image"
                echo "  must start as root, set the allow_root input to the reason."
              fi
              ;;
            *) echo "  ok       user '${user}'" ;;
          esac
          if [ "$status" != 0 ] && [ "${GITHUB_ACTIONS:-}" = true ]; then
            echo "::error title=Image policy::The image breaks the container image standard; see this step's log for what and how to declare an exception."
          fi
          exit "$status"

      - name: Export digest
        if: needs.lint.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: needs.lint.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ inputs.image_name }}-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-26.04
    needs: [lint, build]
    if: needs.lint.outputs.push == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # publish: release pushes only tag builds, and latest goes to the newest
      # release, so dispatching an older tag's build again leaves it alone.
      # Pre-release tags never get it. With publish: push, latest follows the
      # default branch (and metadata-action's own handling of semver tags).
      - name: Choose the tag rules
        id: rules
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = release ]; then
            newest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' |
              grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
            latest=false
            if [ "$GITHUB_REF_NAME" = "$newest" ]; then latest=true; fi
            echo "newest release: ${newest:-none}; ${GITHUB_REF_NAME} gets latest: ${latest}"
            {
              echo "latest=${latest}"
              echo "flavor_latest=false"
              echo "version=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "latest={{is_default_branch}}"
              echo "flavor_latest=auto"
              echo "version={{is_default_branch}}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-${{ inputs.image_name }}-*
          merge-multiple: true

      # A pattern that matches nothing is not an error for download-artifact.
      # The digests live one day (retention-days above), so re-running only this
      # job later found none and failed on a missing /tmp/digests
      # (thelounge-digest, 2026-11-01). Say what to do instead.
      - name: Check the digests
        run: |
          if [ -z "$(ls -A /tmp/digests 2>/dev/null)" ]; then
            echo "::error::No digest artifacts: the build jobs' digests expire after 1 day. Re-run all jobs, not only the failed ones."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: inputs.push_to_dockerhub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version from the image
        id: version
        if: inputs.version_command != ''
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          VERSION_COMMAND: ${{ inputs.version_command }}
        # The digests are per platform; only the amd64 one runs on this runner.
        run: |
          set -euo pipefail
          version=""
          for digest in *; do
            if version=$(docker run --rm --platform linux/amd64 --entrypoint sh \
                "${IMAGE}@sha256:${digest}" -c "${VERSION_COMMAND}" 2>/dev/null) && [ -n "$version" ]; then
              break
            fi
          done
          if ! [[ $version =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version_command printed '${version}', not a version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: List image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          NAMES: ${{ inputs.image_name }},${{ inputs.legacy_image_names }}
          DOCKERHUB_USER: ${{ inputs.push_to_dockerhub && secrets.DOCKER_USERNAME || '' }}
        run: |
          set -euo pipefail
          IFS=', ' read -ra names <<< "$NAMES"
          {
            echo 'list<<EOF'
            for name in "${names[@]}"; do
              [ -n "$name" ] || continue
              echo "ghcr.io/${OWNER}/${name}"
              if [ -n "$DOCKERHUB_USER" ]; then echo "${DOCKERHUB_USER}/${name}"; fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: latest=${{ steps.rules.outputs.flavor_latest }}
          tags: |
            type=raw,value=latest,enable=${{ steps.rules.outputs.latest }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ steps.version.outputs.version && format('type=raw,value={0},enable={1}', steps.version.outputs.version, steps.rules.outputs.version) || '' }}
            ${{ steps.version.outputs.major && format('type=raw,value={0},enable={1}', steps.version.outputs.major, steps.rules.outputs.version) || '' }}
            ${{ inputs.extra_tags }}

      - name: Create multi-arch manifest and push tags
        id: merge
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@sha256:%s ' *)
          SHORT_SHA="${GITHUB_SHA::7}"
          DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:sha-${SHORT_SHA}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Retried once: the action downloads syft from github.com first, and a 504
      # there failed the job after the tags were already pushed, skipping the
      # scans, signing and release (thelounge-digest, 2026-10-26).
      - name: Generate SBOM
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ steps.merge.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ inputs.image_name }}.cyclonedx.json

      - name: Wait before retrying the SBOM
        if: steps.sbom.outcome == 'failure'
        run: sleep 30

      - name: Generate SBOM (retry)
        if: steps.sbom.outcome == 'failure'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ steps.merge.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ inputs.image_name }}.cyclonedx.json

  scan-trivy:
    name: Security Scan (trivy)
    runs-on: ubuntu-26.04
    needs: merge
    # merge runs only when the build pushed (see lint's plan step).
    if: needs.merge.result == 'success'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          # The filter of the whole pipeline (auto-release's base-image check,
          # GitLab's release scan): fixable HIGH and CRITICAL findings only.
          # A report, not a gate: no exit-code.
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          timeout: 10m

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  sign:
    name: Sign Images
    runs-on: ubuntu-26.04
    needs: merge
    if: inputs.enable_cosign && needs.merge.result == 'success'
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push_to_dockerhub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Retried: cosign retries its own Rekor upload, and when the first POST
      # landed but its answer didn't, the retry gets 409 "an equivalent entry
      # already exists" and cosign exits without attaching the signature
      # (renovate-alert, 2026-10-29). A new attempt signs with a new ephemeral
      # key, so it can't conflict with the orphaned entry.
      - name: Sign GHCR image
        env:
          COSIGN_EXPERIMENTAL: "true"
          REPO: ghcr.io/${{ github.repository_owner }}
          NAMES: ${{ inputs.image_name }},${{ inputs.legacy_image_names }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          IFS=', ' read -ra names <<< "$NAMES"
          for name in "${names[@]}"; do
            [ -n "$name" ] || continue
            for attempt in 1 2 3; do
              cosign sign --yes "${REPO}/${name}@${DIGEST}" && continue 2
              echo "::warning::cosign sign of ${name} failed (attempt $attempt of 3)"
              sleep $((attempt * 20))
            done
            exit 1
          done

      - name: Sign Docker Hub image
        if: inputs.push_to_dockerhub
        env:
          COSIGN_EXPERIMENTAL: "true"
          REPO: ${{ secrets.DOCKER_USERNAME }}
          NAMES: ${{ inputs.image_name }},${{ inputs.legacy_image_names }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          IFS=', ' read -ra names <<< "$NAMES"
          for name in "${names[@]}"; do
            [ -n "$name" ] || continue
            for attempt in 1 2 3; do
              cosign sign --yes "${REPO}/${name}@${DIGEST}" && continue 2
              echo "::warning::cosign sign of ${name} failed (attempt $attempt of 3)"
              sleep $((attempt * 20))
            done
            exit 1
          done

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-26.04
    needs: merge
    if: inputs.enable_integration_test && needs.merge.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}@${{ needs.merge.outputs.digest }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: bash scripts/integration-test.sh

  cleanup:
    name: Cleanup old package versions
    runs-on: ubuntu-26.04
    needs: [scan-trivy, sign, integration-test]
    if: |
      always() &&
      needs.scan-trivy.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Delete untagged and old versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # use-regex (below) makes exclude-tags ONE regex (not a comma list),
          # which must pass the action's safe-regex2 check: no nested
          # quantifiers. package stays the plain name: the action logs in to
          # the registry with it, and an anchored ^name$ failed that login.
          # Image names here have no regex metacharacters. A comma list
          # cleans the legacy names too.
          package: ${{ inputs.legacy_image_names && format('{0},{1}', inputs.image_name, inputs.legacy_image_names) || inputs.image_name }}
          keep-n-tagged: 5
          delete-untagged: true
          # Concurrent runs push untagged per-arch digests that their merge job
          # only tags minutes later; without an age floor this cleanup deleted
          # them mid-run ("<image>@sha256:...: not found" on Renovate branches of
          # thelounge-digest and toggl-insights, 2026-10). Applies to every rule.
          older-than: 1 day
          delete-ghost-images: true
          delete-partial-images: true
          # Release tags (1.0.0, v2.3, 3006, 4.5.2-rc1) are what consumers pin as
          # tag@digest, so never delete them. With only latest,main excluded,
          # keep-n-tagged counted every sha-*/branch tag, and a busy day of main
          # pushes deleted backup-monitor's 1.0.0 image while hotel still pinned
          # it (2026-10-22).
          exclude-tags: '^(latest|main|master)$|^v?[0-9][0-9.]*$|^v?[0-9][0-9.]*-[0-9A-Za-z.]+$'
          use-regex: true

  # auto-release.yml carries its own gate (schedule, or a push or manual run
  # on the default branch), so this job only needs a strategy. It follows the
  # build job, which always runs and is a no-op when nothing was built: a push
  # that publish: release or skip_paths left unbuilt still gets its CVE check.
  # No permissions block, as in auto-release.yml: it takes the calling job's,
  # so a caller without actions: write fails at the dispatch, not at startup.
  # A ./ path in a reusable workflow resolves to this repository at the commit
  # the caller pinned, not to the caller's repository.
  auto-release:
    needs: [lint, build]
    if: inputs.release_strategy != ''
    uses: ./.github/workflows/auto-release.yml
    with:
      strategy: ${{ inputs.release_strategy }}
      image: ${{ inputs.release_image || format('ghcr.io/{0}/{1}', github.repository_owner, inputs.image_name) }}
      dockerfiles: ${{ inputs.dockerfiles || inputs.dockerfile }}
      dispatch_workflow: ${{ inputs.dispatch_workflow }}

  # Runs this commit's sha-* image on Cloud Run, only when the merge job
  # pushed one on the default branch: a docs- or CI-only push that skip_paths
  # left unbuilt deploys nothing.
  deploy:
    needs: merge
    if: >-
      inputs.deploy_type != '' && needs.merge.outputs.digest != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/gcp-deploy.yml
    with:
      image_name: ${{ inputs.image_name }}
      deploy_type: ${{ inputs.deploy_type }}
      deploy_name: ${{ inputs.deploy_name || inputs.image_name }}
      region: ${{ inputs.region }}
    secrets: inherit
