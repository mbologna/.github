name: GCP Deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name (e.g. sunrise-sunset-calendar), deployed as {image_registry}/{image_name}:sha-{commit}
        required: true
        type: string
      image_registry:
        description: >-
          Where Cloud Run pulls the image from. The default is an Artifact Registry
          remote repository caching ghcr.io (infra: terraform/artifact-registry), so
          it serves ghcr.io/mbologna/{image_name}; the project's Cloud Run service
          agent needs read access to it.
        required: false
        type: string
        default: us-central1-docker.pkg.dev/infra-cove/ghcr/mbologna
      deploy_type:
        description: "Cloud Run resource type: 'service' or 'job'"
        required: false
        type: string
        default: service
      deploy_name:
        description: Cloud Run service or job name to deploy
        required: true
        type: string
      region:
        description: GCP region
        required: false
        type: string
        default: us-central1
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true

# WIF requires id-token: write.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate deploy_type
        env:
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
        run: |
          if [[ "$DEPLOY_TYPE" != "service" && "$DEPLOY_TYPE" != "job" ]]; then
            echo "::error::deploy_type must be 'service' or 'job', got '$DEPLOY_TYPE'"
            exit 1
          fi

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # The image comes through an Artifact Registry remote repository, which
      # fetches a fresh tag from ghcr.io on the first request. docker.io images
      # came through mirror.gcr.io instead, which could list a tag before it
      # could serve the image, so deploys failed with "Container import failed"
      # for minutes (2026-10-22 in three repos, 2026-11-10), even with a wait
      # for the tag. Retry a failed deploy twice for transient errors.
      - name: Deploy to Cloud Run
        env:
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          DEPLOY_NAME: ${{ inputs.deploy_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          REGION: ${{ inputs.region }}
        run: |
          # Jobs take no --update-labels, and Terraform owns their labels.
          if [[ $DEPLOY_TYPE == service ]]; then
            cmd=(gcloud run deploy --update-labels "managed-by=github-actions,commit-sha=$GITHUB_SHA")
          else
            cmd=(gcloud run jobs deploy)
          fi
          for attempt in 1 2 3; do
            if "${cmd[@]}" "$DEPLOY_NAME" \
                --image "$IMAGE_REGISTRY/$IMAGE_NAME:sha-$SHORT_SHA" \
                --region "$REGION" \
                --quiet; then
              exit 0
            fi
            [[ $attempt == 3 ]] || { echo "::warning::deploy attempt $attempt failed, retrying in 60 s"; sleep 60; }
          done
          exit 1
