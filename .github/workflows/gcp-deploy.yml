name: GCP Deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name (e.g. sunrise-sunset-calendar) — pulled from docker.io/mbologna/{image_name}
        required: true
        type: string
      deploy_type:
        description: "Cloud Run resource type: 'service' or 'job'"
        required: false
        type: string
        default: service
      deploy_name:
        description: Cloud Run service or job name to deploy
        required: true
        type: string
      region:
        description: GCP region
        required: false
        type: string
        default: us-central1
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true

# WIF requires id-token: write.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate deploy_type
        env:
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
        run: |
          if [[ "$DEPLOY_TYPE" != "service" && "$DEPLOY_TYPE" != "job" ]]; then
            echo "::error::deploy_type must be 'service' or 'job', got '$DEPLOY_TYPE'"
            exit 1
          fi

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Cloud Run pulls docker.io images through mirror.gcr.io, which can
      # lag a fresh push by a minute or more; deploying first fails with
      # "Image 'mirror.gcr.io/...' not found" (seen 2026-10-22 in three repos).
      - name: Wait for the image on mirror.gcr.io
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          url="https://mirror.gcr.io/v2/mbologna/${IMAGE_NAME}/manifests/sha-${SHORT_SHA}"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          for _ in $(seq 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Accept: ${accept}" "$url")
            [[ $code == 200 ]] && exit 0
            sleep 15
          done
          echo "::error::mbologna/${IMAGE_NAME}:sha-${SHORT_SHA} not on mirror.gcr.io after 10 minutes (last HTTP ${code})"
          exit 1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # The mirror can list the tag before Cloud Run can import the image
      # ("Container import failed"), so retry a failed deploy twice.
      - name: Deploy to Cloud Run
        env:
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          DEPLOY_NAME: ${{ inputs.deploy_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          REGION: ${{ inputs.region }}
        run: |
          if [[ $DEPLOY_TYPE == service ]]; then cmd=(gcloud run deploy); else cmd=(gcloud run jobs deploy); fi
          for attempt in 1 2 3; do
            if "${cmd[@]}" "$DEPLOY_NAME" \
                --image "docker.io/mbologna/$IMAGE_NAME:sha-$SHORT_SHA" \
                --region "$REGION" \
                --update-labels "managed-by=github-actions,commit-sha=$GITHUB_SHA" \
                --quiet; then
              exit 0
            fi
            [[ $attempt == 3 ]] || { echo "::warning::deploy attempt $attempt failed, retrying in 60 s"; sleep 60; }
          done
          exit 1
