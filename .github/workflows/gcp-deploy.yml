name: GCP Deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name (used to pull from GHCR, e.g. sunrise-sunset-calendar)
        required: true
        type: string
      ar_image:
        description: Full Artifact Registry image URI (e.g. europe-west1-docker.pkg.dev/project/repo/app)
        required: true
        type: string
      deploy_type:
        description: "Cloud Run resource type: 'service' or 'job'"
        required: false
        type: string
        default: service
      deploy_name:
        description: Cloud Run service or job name to deploy
        required: true
        type: string
      region:
        description: GCP region
        required: false
        type: string
        default: europe-west1
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true

# WIF requires id-token: write; packages: read is needed to pull from GHCR.
# Note: GHCR source images must be public, or the calling workflow must grant
# packages: read and pass secrets: inherit so github.token has pull access.
permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy_type
        run: |
          if [[ "${{ inputs.deploy_type }}" != "service" && "${{ inputs.deploy_type }}" != "job" ]]; then
            echo "::error::deploy_type must be 'service' or 'job', got '${{ inputs.deploy_type }}'"
            exit 1
          fi

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Mirror GHCR → Artifact Registry
        run: |
          docker buildx imagetools create \
            --tag ${{ inputs.ar_image }}:sha-${{ steps.sha.outputs.short }} \
            --tag ${{ inputs.ar_image }}:latest \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:sha-${{ steps.sha.outputs.short }}

      - name: Deploy Cloud Run Service
        if: inputs.deploy_type == 'service'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.deploy_name }}
          image: ${{ inputs.ar_image }}:sha-${{ steps.sha.outputs.short }}
          region: ${{ inputs.region }}

      - name: Deploy Cloud Run Job
        if: inputs.deploy_type == 'job'
        run: |
          gcloud run jobs deploy ${{ inputs.deploy_name }} \
            --image ${{ inputs.ar_image }}:sha-${{ steps.sha.outputs.short }} \
            --region ${{ inputs.region }} \
            --quiet
