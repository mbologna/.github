name: Terraform CI

on:
  workflow_call:
    inputs:
      terraform_version:
        description: Terraform version constraint
        required: false
        type: string
        default: "~> 1.9"
      opentofu_version:
        description: OpenTofu version
        required: false
        type: string
        default: "1.13.9"
      enable_shellcheck:
        description: Run ShellCheck on shell scripts
        required: false
        type: boolean
        default: false
      shellcheck_files:
        description: Space-separated list of shell script paths to check
        required: false
        type: string
        default: ""
      working_dir:
        description: Terraform root working directory
        required: false
        type: string
        default: "."
      example_dir:
        description: Optional example subdirectory to also validate (leave empty to skip)
        required: false
        type: string
        default: ""

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working_dir }}

      - name: terraform init
        run: terraform init -backend=false
        working-directory: ${{ inputs.working_dir }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ inputs.working_dir }}

      - name: terraform init (example)
        if: inputs.example_dir != ''
        run: terraform init -backend=false
        working-directory: ${{ inputs.example_dir }}

      - name: terraform validate (example)
        if: inputs.example_dir != ''
        run: terraform validate
        working-directory: ${{ inputs.example_dir }}

  tflint:
    name: tflint
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.65.0

      - name: tflint init
        run: tflint --init

      - name: tflint
        run: tflint --recursive

  opentofu:
    name: OpenTofu Validate
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ inputs.opentofu_version }}

      - name: tofu fmt check
        run: tofu fmt -check -recursive
        working-directory: ${{ inputs.working_dir }}

      - name: tofu init
        run: tofu init -backend=false
        working-directory: ${{ inputs.working_dir }}

      - name: tofu validate
        run: tofu validate
        working-directory: ${{ inputs.working_dir }}

      - name: tofu init (example)
        if: inputs.example_dir != ''
        run: tofu init -backend=false
        working-directory: ${{ inputs.example_dir }}

      - name: tofu validate (example)
        if: inputs.example_dir != ''
        run: tofu validate
        working-directory: ${{ inputs.example_dir }}

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            gitops/ .github/workflows/
        continue-on-error: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy (IaC config scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: ".terraform,example/.terraform"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    if: inputs.enable_shellcheck
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=warning ${{ inputs.shellcheck_files }}
