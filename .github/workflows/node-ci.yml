name: Node.js CI

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version (used when node_versions matrix is not set)
        required: false
        type: string
        default: lts/*
      node_versions:
        description: JSON array of Node.js versions for matrix builds, e.g. '["18.x","20.x","22.x"]'
        required: false
        type: string
        default: ""
      package_manager:
        description: Package manager to use (npm or yarn)
        required: false
        type: string
        default: npm
      test_command:
        description: npm/yarn script to run for tests
        required: false
        type: string
        default: test
      enable_audit:
        description: Run npm audit after install
        required: false
        type: boolean
        default: false
      audit_level:
        description: Minimum vulnerability level that causes npm audit to fail
        required: false
        type: string
        default: moderate

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ inputs.node_versions != '' && fromJSON(inputs.node_versions) || fromJSON(format('["{0}"]', inputs.node_version)) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm install

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Lint
        run: ${{ inputs.package_manager }} run lint
        continue-on-error: true

      - name: Test
        if: inputs.test_command != ''
        run: ${{ inputs.package_manager }} run ${{ inputs.test_command }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    if: inputs.enable_audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Audit
        run: npm audit --audit-level=${{ inputs.audit_level }}
