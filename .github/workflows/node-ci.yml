name: Node.js CI

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version (used when node_versions matrix is not set)
        required: false
        type: string
        default: lts/*
      node_versions:
        description: JSON array of Node.js versions for matrix builds, e.g. '["18.x","20.x","22.x"]'
        required: false
        type: string
        default: ""
      package_manager:
        description: Package manager to use (npm or yarn)
        required: false
        type: string
        default: npm
      test_command:
        description: npm/yarn script to run for tests
        required: false
        type: string
        default: test
      enable_audit:
        description: Run npm audit after install
        required: false
        type: boolean
        default: false
      audit_level:
        description: Minimum vulnerability level that causes npm audit to fail
        required: false
        type: string
        default: moderate
      enable_release_drafter:
        description: Create a GitHub release on tag push
        required: false
        type: boolean
        default: false
      build_command:
        description: Command to build the project (runs after install, after CI passes)
        required: false
        type: string
        default: ""
      build_artifact_name:
        description: Name for the uploaded build artifact
        required: false
        type: string
        default: ""
      build_artifact_path:
        description: Path glob for files to upload as artifact (leave empty to skip upload)
        required: false
        type: string
        default: ""
      build_artifact_retention_days:
        description: Number of days to retain the build artifact
        required: false
        type: number
        default: 30

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ inputs.node_versions != '' && fromJSON(inputs.node_versions) || fromJSON(format('["{0}"]', inputs.node_version)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm install

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Lint
        run: ${{ inputs.package_manager }} run lint
        continue-on-error: true

      - name: Test
        if: inputs.test_command != ''
        run: ${{ inputs.package_manager }} run ${{ inputs.test_command }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ci]
    if: inputs.build_command != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm install

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Upload artifact
        if: inputs.build_artifact_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.build_artifact_name != '' && inputs.build_artifact_name || 'build' }}
          path: ${{ inputs.build_artifact_path }}
          retention-days: ${{ inputs.build_artifact_retention_days }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    if: inputs.enable_audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Audit
        run: npm audit --audit-level=${{ inputs.audit_level }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci]
    if: inputs.enable_release_drafter && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        # release-drafter (previous approach) only lists merged PRs, so repos that
        # push commits directly to main (no PR) always got an empty "No changes"
        # changelog. Compute the range since the last semver tag instead, so the
        # changelog step below can walk raw commits regardless of PR history.
        #
        # The baseline is the last tag with an actual *published* GitHub Release —
        # not just the last git tag. auto-release.yml pushes a tag every time it
        # finds new commits, but this release job only runs when `ci` (needs: [ci])
        # succeeds; if CI ever fails on a given tag, that tag never gets released.
        # Anchoring to the last git tag would then silently drop that tag's commits
        # from every future changelog. Anchoring to the last released tag makes the
        # very next successful run absorb the missed commits instead.
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(gh release list --repo "${GITHUB_REPOSITORY}" \
            --exclude-drafts --exclude-pre-releases --limit 200 \
            --json tagName,publishedAt \
            | jq -r --arg cur "$CURRENT_TAG" \
              '[.[] | select(.tagName != $cur)] | sort_by(.publishedAt) | last.tagName // empty')
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi
          echo "Last released tag: ${PREV_TAG:-<none, first release>}"
          echo "Range: ${RANGE}"
          echo "current_tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Write changelog config
        # tag_pattern is deliberately unmatchable: intermediate tags pushed weekly by
        # auto-release.yml were never turned into GitHub releases, so they must not
        # act as changelog section boundaries — the whole range collapses into one
        # section labelled by --tag below instead.
        run: |
          cat > cliff.toml <<'EOF'
          [changelog]
          header = ""
          body = """
          {% for group, commits in commits | group_by(attribute="group") %}
          ### {{ group | upper_first }}
          {% for commit in commits %}
          - {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
          {% endfor %}
          {% endfor %}
          """
          footer = ""
          trim = true

          [git]
          conventional_commits = true
          filter_unconventional = false
          split_commits = false
          protect_breaking_commits = false
          filter_commits = false
          tag_pattern = "^$"
          topo_order = false
          sort_commits = "oldest"
          commit_parsers = [
            { message = "^feat", group = "Features" },
            { message = "^fix", group = "Bug Fixes" },
            { message = "^perf", group = "Performance" },
            { message = "^refactor", group = "Refactor" },
            { message = "^docs", group = "Documentation" },
            { message = "^test", group = "Testing" },
            { message = "^ci", group = "CI/CD" },
            { message = "^build", group = "Build" },
            { message = "^revert", group = "Reverts" },
            { message = "^chore\\(deps\\)", group = "Dependency Updates" },
            { message = "^chore", group = "Chores" },
            { message = "^style", group = "Styling" },
            { message = "^polish", group = "Polish" },
            { message = ".*", group = "Other Changes" },
          ]
          EOF

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ steps.range.outputs.current_tag }} ${{ steps.range.outputs.range }}

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
