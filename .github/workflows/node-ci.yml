name: Node.js CI

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version (used when node_versions matrix is not set)
        required: false
        type: string
        default: lts/*
      node_versions:
        description: JSON array of Node.js versions for matrix builds, e.g. '["18.x","20.x","22.x"]'
        required: false
        type: string
        default: ""
      package_manager:
        description: Package manager to use (npm or yarn)
        required: false
        type: string
        default: npm
      test_command:
        description: npm/yarn script to run for tests
        required: false
        type: string
        default: test
      coverage_fail_under:
        description: >-
          Minimum line coverage, in percent, below which the test job fails.
          The test script must run node --test (Node.js 22.8 or later): the
          workflow adds --experimental-test-coverage and
          --test-coverage-lines to it, and fails when no coverage report
          comes out. Empty (the default) runs the tests without coverage.
        required: false
        type: string
        default: ""
      enable_audit:
        description: Run npm audit after install
        required: false
        type: boolean
        default: false
      audit_level:
        description: Minimum vulnerability level that causes npm audit to fail
        required: false
        type: string
        default: moderate
      audit_omit_dev:
        description: Audit production dependencies only (npm audit --omit=dev). For packages whose devDependencies never ship, e.g. CSS-only themes
        required: false
        type: boolean
        default: false
      build_command:
        description: Command to build the project (runs after install, after CI passes)
        required: false
        type: string
        default: ""
      build_artifact_name:
        description: Name for the uploaded build artifact
        required: false
        type: string
        default: ""
      build_artifact_path:
        description: Path glob for files to upload as artifact (leave empty to skip upload)
        required: false
        type: string
        default: ""
      build_artifact_retention_days:
        description: Number of days to retain the build artifact
        required: false
        type: number
        default: 30

jobs:
  ci:
    # A single version runs as "Test", so the required check keeps its name
    # when node_version moves; a node_versions matrix needs one name per version.
    name: ${{ inputs.node_versions != '' && format('Node.js {0}', matrix.node-version) || 'Test' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ inputs.node_versions != '' && fromJSON(inputs.node_versions) || fromJSON(format('["{0}"]', inputs.node_version)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm install

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Lint
        run: ${{ inputs.package_manager }} run lint
        continue-on-error: true

      # The coverage gate. node refuses the test runner's coverage flags in
      # NODE_OPTIONS and ignores them after the file arguments, so a node shim
      # first on PATH adds them to every node --test the test script starts,
      # whatever its arguments (and its pre and post scripts still run).
      - name: Test
        if: inputs.test_command != ''
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          TEST_COMMAND: ${{ inputs.test_command }}
          FAIL_UNDER: ${{ inputs.coverage_fail_under }}
        run: |
          set -euo pipefail
          # test_command may carry arguments (test -- --flag), as before.
          read -ra test_command <<< "$TEST_COMMAND"
          if [ -z "$FAIL_UNDER" ]; then
            "$PACKAGE_MANAGER" run "${test_command[@]}"
            exit 0
          fi
          if ! [[ $FAIL_UNDER =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::coverage_fail_under must be a number of percent, not '${FAIL_UNDER}'"
            exit 1
          fi
          echo "Coverage gate: ${FAIL_UNDER}% of lines (coverage_fail_under input)"
          shim="${RUNNER_TEMP}/node-coverage"
          mkdir -p "$shim"
          node_bin=$(command -v node)
          cat > "${shim}/node" <<EOF
          #!/bin/sh
          for arg; do
            if [ "\$arg" = --test ]; then
              exec "${node_bin}" --experimental-test-coverage --test-coverage-lines="${FAIL_UNDER}" "\$@"
            fi
          done
          exec "${node_bin}" "\$@"
          EOF
          chmod +x "${shim}/node"
          PATH="${shim}:${PATH}" "$PACKAGE_MANAGER" run "${test_command[@]}" 2>&1 | tee "${RUNNER_TEMP}/test.log"
          if ! grep -q 'start of coverage report' "${RUNNER_TEMP}/test.log"; then
            echo "::error::coverage_fail_under is set, but the test script printed no coverage report: it must run node --test."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-26.04
    needs: [ci]
    if: inputs.build_command != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm install

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Upload artifact
        if: inputs.build_artifact_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.build_artifact_name != '' && inputs.build_artifact_name || 'build' }}
          path: ${{ inputs.build_artifact_path }}
          retention-days: ${{ inputs.build_artifact_retention_days }}

  audit:
    name: npm audit
    runs-on: ubuntu-26.04
    if: inputs.enable_audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package_manager == 'yarn'
        run: yarn --frozen-lockfile --non-interactive

      - name: Audit
        run: npm audit --audit-level=${{ inputs.audit_level }}${{ inputs.audit_omit_dev && ' --omit=dev' || '' }}
