name: PHP CI

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version
        required: false
        type: string
        default: "8.3"
      php_extensions:
        description: Comma-separated list of PHP extensions to install
        required: false
        type: string
        default: ""
      composer_options:
        description: Options passed to composer install
        required: false
        type: string
        default: "--no-interaction --prefer-dist"
      enable_composer_cache:
        description: Cache Composer dependencies between runs
        required: false
        type: boolean
        default: false
      pre_test_command:
        description: Command to run before tests (e.g., creating test fixtures)
        required: false
        type: string
        default: ""
      test_command:
        description: Command to run tests
        required: false
        type: string
        default: vendor/bin/phpunit
      enable_test:
        description: Run the test job
        required: false
        type: boolean
        default: true
      enable_lint:
        description: Run a lint check
        required: false
        type: boolean
        default: false
      lint_command:
        description: Lint command to run (defaults to php-cs-fixer fix --dry-run --diff --verbose)
        required: false
        type: string
        default: ""
      lint_tools:
        description: PHP tools to install for the lint job (comma-separated)
        required: false
        type: string
        default: php-cs-fixer

jobs:
  ci:
    name: PHP ${{ inputs.php_version }}
    runs-on: ubuntu-latest
    if: inputs.enable_test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        if: inputs.enable_composer_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ inputs.php_version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ inputs.php_version }}-
            ${{ runner.os }}-php-

      - name: Validate composer.json
        run: composer validate --strict
        continue-on-error: true

      - name: Install dependencies
        run: composer install ${{ inputs.composer_options }}

      - name: Pre-test setup
        if: inputs.pre_test_command != ''
        run: ${{ inputs.pre_test_command }}

      - name: Run tests
        run: ${{ inputs.test_command }}

  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    if: inputs.enable_lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: ${{ inputs.lint_tools }}

      - name: Lint
        run: ${{ inputs.lint_command != '' && inputs.lint_command || 'php-cs-fixer fix --dry-run --diff --verbose' }}
        continue-on-error: true
