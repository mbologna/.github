name: Cache Cleanup

on:
  workflow_call:
    inputs:
      max_age_days:
        description: Delete cache entries older than this many days
        required: false
        type: number
        default: 7

jobs:
  cleanup:
    name: Cleanup Actions Cache
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete stale cache entries
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const maxAgeDays = ${{ inputs.max_age_days }};
            const cutoff = new Date(Date.now() - maxAgeDays * 24 * 60 * 60 * 1000);
            let deleted = 0;
            let page = 1;

            while (true) {
              const { data: caches } = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });

              if (caches.actions_caches.length === 0) break;

              for (const cache of caches.actions_caches) {
                if (new Date(cache.last_accessed_at) < cutoff) {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  deleted++;
                }
              }

              if (caches.total_count <= page * 100) break;
              page++;
            }

            core.info(`Deleted ${deleted} cache entries older than ${maxAgeDays} days`);
