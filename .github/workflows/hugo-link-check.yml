name: Hugo Link Check

on:
  workflow_call:
    inputs:
      hugo_version:
        description: Hugo version to use
        required: false
        type: string
        default: '0.161.1'
      fail_on_broken:
        description: Fail the job if broken links are found
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ inputs.hugo_version }}
          extended: true

      - name: Build
        run: hugo --minify

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >-
            --root-dir ./public
            --timeout 30
            --max-retries 3
            ./public/
          fail: false
          output: lychee/out.md
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: "Broken links detected"
          content-filepath: lychee/out.md
          labels: broken-links

      - name: Fail if broken links found
        if: ${{ inputs.fail_on_broken && steps.lychee.outputs.exit_code != 0 }}
        run: exit 1
