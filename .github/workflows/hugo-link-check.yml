name: Hugo Link Check

on:
  workflow_call:
    inputs:
      hugo_version:
        description: Hugo version to use
        required: false
        type: string
        default: '0.166.0'
      fail_on_broken:
        description: Fail the job if broken links are found
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ inputs.hugo_version }}
          extended: true

      - name: Build
        run: hugo --minify

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --root-dir ./public
            --timeout 30
            --max-retries 3
            ./public/
          fail: false
          output: lychee/out.md
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # one open issue at a time: refresh it on every failing run, close it
      # once the links pass again
      - name: Find open broken links issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create or update issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "Broken links detected"
          content-filepath: lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.issue.outputs.number }}

      - name: Close issue when links are fixed
        if: steps.lychee.outputs.exit_code == 0 && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "All links pass as of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

      - name: Fail if broken links found
        if: ${{ inputs.fail_on_broken && steps.lychee.outputs.exit_code != 0 }}
        run: exit 1
