name: Commits

# Lints every commit of a pull request with mbologna/commitlint-config's
# action: the shared commit rules, plus a gate that fails fixup!, squash! and
# amend! commits. Pull requests merge with a merge commit, so their commits
# land on the default branch as they are, and auto-release reads their
# subjects for the version bump and the release notes. Callers run it from
# their own commits.yml on `pull_request`.
#
# The action is pinned like any other: a rule change reaches the callers once
# this pin moves, and then theirs.

on:
  workflow_call:
  # This repository's own pull requests.
  pull_request:

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: mbologna/commitlint-config@81880b04ef3a10cc75db40cf0372c375a2d079bc # main
