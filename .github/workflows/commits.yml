name: Commits

# Lints every commit of a pull request with mbologna/commitlint-config's
# action: the shared commit rules, plus a gate that fails fixup!, squash! and
# amend! commits. Pull requests merge with a merge commit, so their commits
# land on the default branch as they are, and auto-release reads their
# subjects for the version bump and the release notes. Callers run it from
# their own commits.yml on `pull_request`. The private repositories, which
# GitHub Free gives no rulesets, also run it on `push` to main: there it
# reports a commit that reached main without a pull request, and can't block.
#
# The action is pinned like any other: a rule change reaches the callers once
# this pin moves, and then theirs.

on:
  workflow_call:
  # This repository's own pull requests.
  pull_request:

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-26.04
    # No permissions block: the job takes the caller's, which a called job
    # could only narrow. Public callers grant pull-requests: read; a private
    # one also grants contents: read, which the push mode's compare and commit
    # API calls need there.
    steps:
      - uses: mbologna/commitlint-config@7528913b5859d0f5567e50291ff7891cb7ea8a87 # v0.2.0
