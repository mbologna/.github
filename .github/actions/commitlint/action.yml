name: Conventional commits
description: >-
  Lint every commit of the pull request with the shared commitlint base:
  config-conventional, 72-character header and body lines (Renovate's update
  headers up to 100), no Co-authored-by or AI "Generated with" lines.

# base.mjs is a copy of the dotfiles ~/.commitlintrc.mjs, the shared base every
# personal repository uses; the dotfiles tests fail when the two differ.
# The messages come from the API, so the job needs only pull-requests: read
# and no checkout. A repository's own commitlint config is not read: the
# repositories that have one (dotfiles, infra) lint in their own CI.

runs:
  using: composite
  steps:
    - name: Install commitlint
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --silent --no-audit --no-fund
    - name: Lint the pull request's commits
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # Fetched first: a failed call stops here instead of linting its error
        commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | "\(.sha) \(.commit.message | @base64)"')
        failed=0 count=0
        while read -r sha message; do
          count=$((count + 1))
          echo "::group::${sha:0:12}"
          if ! printf '%s' "$message" | base64 -d | node_modules/.bin/commitlint -g base.mjs; then
            failed=$((failed + 1))
            echo "::error title=commitlint::${sha:0:12} does not follow the commit rules"
          fi
          echo "::endgroup::"
        done <<<"$commits"
        echo "$count commits linted, $failed failed"
        ((count > 0 && failed == 0))
